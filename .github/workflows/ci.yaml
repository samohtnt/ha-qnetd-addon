name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./qnetd

  e2e:
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - run: bash tests/e2e.sh
        env:
          # Set on this step only: the QEMU setup step must pull its own image for the runner.
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
          E2E_WAIT: ${{ matrix.platform == 'linux/arm64' && 180 || 30 }}
