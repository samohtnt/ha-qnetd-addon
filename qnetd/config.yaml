name: Proxmox QNetd
version: "1.1.1"
slug: qnetd
description: Corosync QNetd tie-breaker vote for a two-node Proxmox VE cluster
url: https://github.com/samohtnt/ha-qnetd-addon
arch:
  - aarch64
  - amd64
startup: services
hassio_api: true
ports:
  5403/tcp: 5403
  22022/tcp: 22022
ports_description:
  5403/tcp: QNetd (corosync quorum device)
  22022/tcp: Pairing SSH, open only during setup
options:
  open_pairing: false
schema:
  open_pairing: bool
