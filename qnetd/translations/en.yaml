configuration:
  open_pairing:
    name: Open pairing
    description: >-
      Pairing opens by itself until the first cluster is set up. Turn this on
      to open it again, for example to add a second cluster or to redo the
      setup. Turn it off afterwards.
network:
  5403/tcp: QNetd (corosync quorum device)
  22022/tcp: Pairing SSH, open only during setup
